["¿Qué principio describe el reclutamiento ordenado de unidades motoras desde menor a mayor umbral?",["Principio del tamaño","Ley de Fick","Principio de Bernoulli","Ley de Laplace"],0,"El principio del tamaño indica que, en términos generales, se reclutan primero unidades motoras pequeñas y de menor umbral, seguidas por unidades mayores cuando aumenta la demanda."],
["¿Qué ocurre con la fuerza de una fibra al aumentar la frecuencia de potenciales de acción?",["Puede aumentar por sumación temporal hasta una contracción tetánica","Disminuye siempre","Se vuelve independiente del calcio","No cambia bajo ninguna condición"],0,"Una mayor frecuencia de estímulo permite que el Ca²⁺ permanezca elevado en el citosol, aumentando la interacción actina-miosina y la fuerza hasta alcanzar una contracción sostenida."],
["¿Cuál es la función principal del retículo sarcoplásmico?",["Almacenar y liberar Ca²⁺ para regular la contracción","Sintetizar ATP directamente","Oxidar ácidos grasos","Producir acetilcolina"],0,"El retículo sarcoplásmico almacena Ca²⁺ y lo libera ante la activación, permitiendo que el calcio se una a troponina y facilite la interacción actina-miosina."],
["¿Qué ocurre cuando Ca²⁺ se une a troponina C?",["Se desplaza la tropomiosina y se facilita la unión actina-miosina","Se bloquea permanentemente la actina","Se degrada ATP extracelular","Se inhibe toda liberación de calcio"],0,"La unión de Ca²⁺ a troponina C cambia el complejo regulador y desplaza la tropomiosina, exponiendo sitios de unión para la miosina."],
["¿Qué característica diferencia principalmente una contracción excéntrica?",["El músculo activo se alarga mientras desarrolla tensión","El músculo siempre se acorta","No existe producción de fuerza","No participa el sistema nervioso"],0,"En una acción excéntrica, el músculo activo produce tensión mientras aumenta su longitud externa."],
["¿Por qué una acción excéntrica puede producir mayor fuerza que una concéntrica?",["Contribuyen propiedades de puentes cruzados y elementos elásticos que permiten resistir altas cargas","Porque no requiere ATP","Porque no necesita activación neural","Porque todas las fibras están relajadas"],0,"La mecánica de los puentes cruzados y los elementos elásticos permite generar o resistir fuerzas elevadas durante el alargamiento activo."],
["¿Qué receptor detecta principalmente cambios de longitud muscular?",["Huso neuromuscular","Órgano tendinoso de Golgi","Barorreceptor","Quimiorreceptor"],0,"Los husos musculares detectan longitud y velocidad de cambio de longitud, participando en reflejos y regulación del tono."],
["¿Qué receptor responde principalmente a la tensión desarrollada en el tendón?",["Órgano tendinoso de Golgi","Huso muscular","Fotorreceptor","Osmorreceptor"],0,"El órgano tendinoso de Golgi detecta tensión y participa en la regulación refleja de la actividad muscular."],
["¿Qué cambio neural puede contribuir a mejorar la fuerza al inicio de un programa de entrenamiento?",["Mayor activación neural y mejor coordinación intermuscular","Disminución del reclutamiento","Pérdida de sincronización","Reducción de la frecuencia de descarga"],0,"Las primeras mejoras de fuerza pueden estar dominadas por adaptaciones neurales: mayor activación agonista, mejor coordinación y menor activación antagonista."],
["¿Qué es la coactivación antagonista?",["Activación simultánea parcial de músculos agonistas y antagonistas","Ausencia total de activación muscular","Contracción exclusiva del antagonista","Relajación simultánea de todos los músculos"],0,"La coactivación puede aumentar la estabilidad articular, aunque una coactivación excesiva puede reducir el torque neto disponible para el movimiento."],
["¿Qué relación fuerza-longitud explica que exista una longitud óptima para producir tensión activa?",["Solapamiento entre actina y miosina","Disponibilidad de glucógeno hepático","Frecuencia cardíaca","Ventilación alveolar"],0,"La fuerza activa depende del número de puentes cruzados posibles, que está condicionado por el grado de solapamiento entre filamentos."],
["¿Qué ocurre cuando el sarcómero está excesivamente acortado?",["El solapamiento de filamentos puede reducir la capacidad de generar fuerza activa","La fuerza aumenta indefinidamente","Desaparece la necesidad de Ca²⁺","La miosina deja de contener cabezas"],0,"Con acortamiento excesivo, el solapamiento actina-actina y otras limitaciones mecánicas reducen el número efectivo de puentes cruzados capaces de producir tensión."],
["¿Qué componente aporta una porción importante de la rigidez pasiva muscular?",["Elementos estructurales como titina y tejido conectivo","ATP libre únicamente","Acetilcolina plasmática","Hemoglobina"],0,"La rigidez pasiva proviene de elementos elásticos intramusculares y del tejido conectivo, incluyendo contribuciones de titina."],
["¿Qué mecanismo explica la relación fuerza-velocidad en una acción concéntrica?",["A mayor velocidad de acortamiento, menor fuerza máxima que puede producirse","A mayor velocidad, mayor fuerza sin límite","La fuerza es independiente de la velocidad","Solo depende de la frecuencia cardíaca"],0,"En condiciones concéntricas, la capacidad de generar fuerza disminuye conforme aumenta la velocidad de acortamiento."],
["En una contracción isométrica ideal, ¿qué ocurre con la longitud externa del músculo?",["Permanece aproximadamente constante mientras se desarrolla tensión","Aumenta continuamente","Disminuye continuamente","Se vuelve cero"],0,"La contracción isométrica produce tensión sin un cambio apreciable en la longitud externa del músculo."],
["¿Qué es la tasa de desarrollo de fuerza?",["Velocidad con la que aumenta la fuerza durante una contracción","Fuerza máxima absoluta únicamente","Tiempo total de recuperación","Cantidad de ATP almacenada"],0,"La tasa de desarrollo de fuerza describe cuánto cambia la fuerza por unidad de tiempo y es relevante en acciones explosivas."],
["¿Qué efecto tiene una mayor sección transversal fisiológica del músculo?",["Puede aumentar la capacidad potencial de producir fuerza","Reduce siempre la fuerza","Elimina la influencia neural","Impide acciones excéntricas"],0,"Una mayor sección transversal suele asociarse con mayor cantidad de sarcómeros en paralelo y, por tanto, mayor potencial de producción de fuerza."],
["¿Qué diferencia básica existe entre fibras tipo I y tipo II?",["Las tipo I presentan mayor perfil oxidativo y resistencia a la fatiga; las II suelen presentar mayor velocidad y potencia","Las tipo I son exclusivamente anaeróbicas","Las tipo II no pueden producir fuerza","No existen diferencias funcionales"],0,"Las fibras tipo I tienen características oxidativas y resistentes a la fatiga; las tipo II, especialmente las rápidas, presentan mayor capacidad de producir fuerza y potencia rápidamente."],
["¿Qué sucede con la velocidad de conducción nerviosa cuando aumenta el diámetro axonal y la mielinización?",["Tiende a aumentar","Tiende a disminuir necesariamente","No puede cambiar","Se vuelve independiente de la membrana"],0,"Mayor diámetro y mielinización reducen la resistencia efectiva y permiten conducción saltatoria más rápida."]
],
biomecanica:[
["Un torque externo de 120 N·m actúa con un brazo perpendicular de 0,60 m. ¿Qué fuerza lo produce?",["72 N","100 N","200 N","720 N"],2,"F = T/r = 120/0,60 = 200 N."],
["Si el brazo de momento aumenta de 0,25 a 0,50 m con la misma fuerza, el torque:",["Se reduce a la mitad","Se duplica","Permanece igual","Se cuadruplica necesariamente"],1,"Torque = F × r. Al duplicarse el brazo de momento manteniendo la fuerza constante, el torque se duplica."],
["¿Qué diferencia principal existe entre cinemática y cinética?",["La cinemática describe movimiento; la cinética estudia fuerzas y torques que lo producen","La cinemática estudia metabolismo; la cinética estudia respiración","Ambas son sinónimos","La cinética describe solo posición"],0,"La cinemática analiza posición, velocidad y aceleración sin centrarse en las causas; la cinética analiza fuerzas y momentos asociados al movimiento."],
["¿Qué ocurre con la aceleración angular si aumenta el torque neto manteniendo constante el momento de inercia?",["Aumenta","Disminuye","Permanece siempre igual","Se vuelve negativa obligatoriamente"],0,"Según τ = Iα, si I es constante, aumentar el torque neto aumenta la aceleración angular."],
["¿Qué factor aumenta el momento de inercia de un segmento respecto a un eje?",["Distribuir más masa lejos del eje","Concentrar toda la masa sobre el eje","Reducir la masa a cero","Eliminar el radio de giro"],0,"El momento de inercia depende de la distribución de masa respecto al eje. Masa más alejada aumenta I."],
["En una palanca de tercer género, ¿dónde se ubica la fuerza muscular respecto al fulcro y resistencia?",["Entre el fulcro y la resistencia","La resistencia entre fulcro y fuerza","El fulcro entre fuerza y resistencia","No existe fulcro"],0,"En una palanca de tercer género, la fuerza se aplica entre el fulcro y la resistencia. Es común en el sistema musculoesquelético y favorece velocidad y amplitud de movimiento."],
["¿Qué ventaja mecánica implica un brazo interno mayor que el externo?",["Se requiere menor fuerza muscular para equilibrar una misma resistencia","Se requiere siempre mayor fuerza muscular","El torque externo desaparece","No cambia la relación de fuerzas"],0,"Si el brazo interno es mayor, el músculo necesita menor fuerza para generar un torque equivalente al externo."],
["¿Qué es el centro de masa?",["Punto que representa la distribución media de la masa del sistema","El punto donde siempre está el corazón","La articulación más grande","El punto de máxima velocidad"],0,"El centro de masa representa la posición media ponderada de la masa del cuerpo o sistema."],
["¿Qué ocurre con la estabilidad al aumentar la base de sustentación, manteniendo constantes los demás factores?",["Puede aumentar","Disminuye necesariamente","Se vuelve independiente de la base","Desaparece el efecto de gravedad"],0,"Una base de sustentación mayor puede aumentar el margen antes de que la proyección del centro de masa salga de la base."],
["¿Qué ocurre al elevar el centro de masa, manteniendo la base constante?",["Generalmente disminuye la estabilidad estática","Aumenta siempre la estabilidad","No cambia ninguna variable mecánica","El peso desaparece"],0,"Un centro de masa más alto suele reducir el margen de estabilidad y aumenta la distancia que debe recorrer la proyección para salir de la base."],
["¿Qué representa una velocidad angular de 2 rad/s?",["Cambio angular de 2 radianes por segundo","Fuerza de 2 N","Torque de 2 N·m","Aceleración de 2 m/s²"],0,"La velocidad angular expresa el cambio de posición angular por unidad de tiempo y se mide en rad/s."],
["Si un segmento rota 180° en 0,5 s a velocidad angular media constante, ¿cuál es su magnitud?",["π rad/s","2π rad/s","4π rad/s","0,5π rad/s"],1,"180° = π rad. ω = Δθ/Δt = π/0,5 = 2π rad/s."],
["¿Qué describe la aceleración lineal?",["Cambio de velocidad lineal por unidad de tiempo","Cambio de posición sin tiempo","Fuerza dividida por distancia","Cambio de masa por segundo"],0,"La aceleración lineal es la variación de la velocidad respecto al tiempo."],
["¿Qué ocurre con la fuerza necesaria para producir una aceleración determinada si la masa aumenta?",["Aumenta proporcionalmente","Disminuye","No cambia","Se vuelve independiente de la masa"],0,"Según F = ma, para una misma aceleración, una mayor masa requiere una fuerza neta mayor."],
["¿Qué es un momento externo en una articulación?",["El efecto rotacional de una fuerza externa respecto al eje articular","La masa del músculo","La velocidad de conducción nerviosa","La presión arterial"],0,"El momento externo es el torque producido por una fuerza externa respecto a un eje o articulación."],
["En una sentadilla, aumentar la inclinación anterior del tronco puede modificar principalmente:",["Los brazos de momento externos y la distribución de demanda entre articulaciones","La cantidad de ATP almacenada","La frecuencia cardíaca máxima genética","El número de vértebras"],0,"Cambiar la posición del tronco modifica las líneas de acción y brazos de momento, alterando las demandas relativas de cadera, rodilla y columna."],
["¿Qué significa que una fuerza tenga una línea de acción que pasa por el eje articular?",["Su momento respecto a ese eje es aproximadamente cero","Su fuerza es cero","Genera el torque máximo","Aumenta automáticamente el brazo de momento"],0,"Si la línea de acción pasa por el eje, la distancia perpendicular es cero y por tanto el momento es cero."],
["¿Qué variable se conserva en ausencia de torque externo neto en un sistema?",["Momento angular","Fuerza muscular","Potencia metabólica","Frecuencia cardíaca"],0,"En ausencia de torque externo neto, el momento angular total se conserva."],
["¿Qué es potencia mecánica?",["Trabajo realizado por unidad de tiempo","Fuerza multiplicada por distancia únicamente","Masa dividida por aceleración","Torque sin componente temporal"],0,"La potencia es la tasa de realización de trabajo: P = W/t. En movimiento rotacional también puede expresarse como τω."],
["Si el torque es 50 N·m y la velocidad angular 4 rad/s, la potencia mecánica es:",["12,5 W","54 W","200 W","400 W"],2,"P = τω = 50 × 4 = 200 W."]
],
fuerza:[
["¿Qué estímulo está más directamente relacionado con hipertrofia cuando el volumen es adecuado?",["Tensión mecánica sobre las fibras musculares","Frecuencia cardíaca de reposo","Temperatura ambiental aislada","Flexibilidad pasiva exclusivamente"],0,"La tensión mecánica es un estímulo central para las adaptaciones hipertróficas. Volumen, proximidad al fallo y otros factores modulan la respuesta."],
["¿Qué variable representa mejor el volumen de entrenamiento en fuerza?",["Series × repeticiones × carga, con matices según el ejercicio","Frecuencia cardíaca máxima únicamente","Tiempo de sueño","Rango de movimiento sin carga"],0,"El volumen puede cuantificarse de distintas formas; una medida común es tonelaje = series × repeticiones × carga. No captura toda la complejidad del estímulo."],
["¿Qué significa entrenar cerca del fallo muscular?",["Realizar la serie con pocas repeticiones posibles antes de no poder completar otra con técnica adecuada","Usar siempre una carga máxima de una repetición","Evitar cualquier esfuerzo","Trabajar exclusivamente con cargas ligeras"],0,"La proximidad al fallo describe cuántas repeticiones quedan en reserva antes de no poder completar otra repetición técnicamente válida."],
["¿Qué adaptación suele predominar en las primeras semanas de fuerza en personas no entrenadas?",["Adaptaciones neurales y de coordinación","Hipertrofia máxima inmediata","Aumento instantáneo de longitud ósea","Disminución de activación muscular"],0,"Al inicio, las mejoras pueden producirse rápidamente por adaptación neural, coordinación y aprendizaje técnico antes de que la hipertrofia explique una gran parte del aumento."],
["¿Qué principio exige aumentar gradualmente el estímulo para seguir generando adaptación?",["Sobrecarga progresiva","Inmovilización","Aleatorización absoluta","Desuso"],0,"La sobrecarga progresiva consiste en aumentar de forma planificada la demanda cuando el organismo se adapta al estímulo actual."],
["¿Qué variable afecta directamente la intensidad relativa de una serie?",["Carga utilizada respecto a la capacidad máxima del individuo","Color del equipo","Temperatura del gimnasio exclusivamente","Duración del calentamiento solamente"],0,"La intensidad relativa puede expresarse como porcentaje de 1RM o mediante otras escalas que estiman cuán cerca se encuentra la carga de la capacidad máxima."],
["¿Qué ocurre si se aumenta el volumen semanal demasiado rápido?",["Puede aumentar la fatiga y superar la capacidad de recuperación","La adaptación aumenta sin límite","La recuperación deja de ser necesaria","La fuerza siempre se duplica"],0,"Una progresión excesiva puede elevar la fatiga y reducir el rendimiento o aumentar el riesgo de molestias. La respuesta depende del individuo y del contexto."],
["¿Qué variable favorece la especificidad de la fuerza desarrollada?",["Patrón de movimiento, velocidad, rango y tipo de contracción entrenados","Solo la duración del calentamiento","El peso corporal sin entrenamiento","La frecuencia cardíaca de reposo"],0,"Las adaptaciones son específicas de las demandas mecánicas y neuromusculares del ejercicio, incluyendo posición, velocidad, rango y tipo de contracción."],
["¿Qué efecto puede tener un rango de movimiento mayor si es tolerado y apropiado para el objetivo?",["Puede aumentar el trabajo y la demanda sobre ciertos músculos y posiciones articulares","Siempre reduce el estímulo","Elimina la tensión mecánica","No modifica ninguna variable"],0,"Un mayor ROM puede modificar longitud muscular, trabajo y momento articular. Su utilidad depende del ejercicio, objetivo y tolerancia individual."],
["¿Qué describe la relación dosis-respuesta del entrenamiento?",["Cómo cambia la adaptación al modificar variables como volumen, intensidad o frecuencia","Que todas las dosis producen la misma adaptación","Que solo importa la carga absoluta","Que no existe individualización"],0,"La dosis-respuesta estudia cómo las adaptaciones cambian al modificar la cantidad y características del estímulo."],
["¿Qué puede ocurrir con la fuerza durante un déficit energético prolongado?",["Puede verse comprometida por menor disponibilidad energética y recuperación, aunque la magnitud depende del contexto","Siempre aumenta","No cambia jamás","Se vuelve independiente del entrenamiento"],0,"La disponibilidad energética insuficiente puede afectar rendimiento, recuperación y adaptaciones. La respuesta depende de magnitud, duración, proteína, entrenamiento y estado individual."],
["¿Qué papel tiene la proteína dietaria en adaptación al entrenamiento de fuerza?",["Aporta aminoácidos necesarios para síntesis y remodelación de proteínas musculares","Sustituye completamente al estímulo mecánico","Elimina la necesidad de energía","Impide toda síntesis proteica"],0,"La proteína proporciona aminoácidos para síntesis de proteínas. Sin embargo, la ingesta proteica no sustituye el estímulo mecánico del entrenamiento."],
["¿Qué describe mejor la hipertrofia sarcoplasmática?",["Aumento de componentes no contráctiles y contenido sarcoplasmático junto con cambios estructurales","Pérdida de proteínas contráctiles obligatoria","Aumento de hueso exclusivamente","Disminución del volumen celular"],0,"El término describe aumentos en componentes sarcoplasmáticos; en la práctica la hipertrofia muscular incluye cambios múltiples y no se separa de forma absoluta en categorías puras."],
["¿Qué adaptación tendinosa puede ocurrir con entrenamiento de fuerza?",["Cambios en rigidez y propiedades mecánicas del tendón","Desaparición del colágeno","Pérdida obligatoria de rigidez","Aumento inmediato de longitud ósea"],0,"La carga mecánica puede modificar propiedades del tendón, incluida rigidez, área transversal y organización del tejido, dependiendo del estímulo y tiempo."],
["¿Qué diferencia existe entre fuerza máxima y potencia?",["Fuerza máxima enfatiza la mayor fuerza; potencia integra fuerza y velocidad","Son idénticas","Potencia solo mide masa corporal","Fuerza máxima depende únicamente de velocidad"],0,"La fuerza máxima representa la mayor fuerza alcanzable; la potencia depende de fuerza y velocidad y es relevante cuando importa producir trabajo rápidamente."],
["¿Qué ejercicio requiere mayor demanda de estabilización global?",["Depende de carga, técnica, base de apoyo y grados de libertad; no puede determinarse solo por el nombre del ejercicio","Siempre el ejercicio con más repeticiones","Siempre el ejercicio unilateral","Siempre el ejercicio sentado"],0,"La estabilización depende de múltiples variables biomecánicas. El nombre del ejercicio por sí solo no permite cuantificarla."],
["¿Qué significa RIR 2?",["Se estima que podrían completarse aproximadamente dos repeticiones adicionales con técnica adecuada","Se realizaron dos repeticiones totales","La carga es 2% del 1RM","Se descansan dos segundos"],0,"RIR significa repeticiones en reserva. RIR 2 indica que, subjetivamente, quedarían unas dos repeticiones antes del fallo técnico."],
["¿Qué adaptación permite mover una misma carga con menor esfuerzo relativo?",["Aumento de la capacidad de producir fuerza máxima","Disminución de fuerza máxima","Menor coordinación","Pérdida de masa muscular"],0,"Si aumenta la fuerza máxima y la carga externa permanece constante, esa carga representa un menor porcentaje de la capacidad máxima."],
["¿Qué factor puede aumentar la fatiga dentro de una sesión de fuerza?",["Alto volumen, descansos insuficientes y proximidad elevada al fallo","Mayor descanso entre series","Reducción del volumen","Menor intensidad relativa"],0,"El volumen, la intensidad relativa, la proximidad al fallo y los intervalos de descanso interactúan para determinar la fatiga acumulada."],
["¿Qué caracteriza mejor una progresión autorregulada?",["Ajustar carga o volumen según el rendimiento y estado del deportista","Usar exactamente la misma carga independientemente del rendimiento","Cambiar ejercicios aleatoriamente cada día","Eliminar la evaluación"],0,"La autorregulación permite adaptar la dosis a la respuesta diaria usando RPE, RIR, velocidad de la barra u otros indicadores."]
],
resistencia:[
["¿Qué representa el VO₂máx?",["La máxima tasa integrada de consumo de oxígeno durante ejercicio incremental","La cantidad de oxígeno almacenado en sangre","La ventilación máxima exclusivamente","La frecuencia cardíaca máxima"],0,"VO₂máx refleja la máxima capacidad integrada de captar, transportar y utilizar oxígeno durante ejercicio, aunque su medición y criterios dependen del protocolo."],
["¿Qué factor puede mejorar el rendimiento aeróbico sin aumentar mucho el VO₂máx?",["Mejorar la economía de movimiento","Reducir la capacidad mitocondrial","Aumentar el coste energético a una velocidad dada","Reducir el umbral funcional"],0,"La economía puede mejorar por adaptaciones neuromusculares, biomecánicas y metabólicas, permitiendo sostener una velocidad con menor consumo de oxígeno."],
["¿Qué diferencia existe entre umbral de lactato y concentración fija de lactato?",["El primero puede definirse por un cambio individual en la relación lactato-carga; el segundo usa un valor prefijado","Son siempre idénticos","El umbral no depende del ejercicio","La concentración fija siempre es individualizada"],0,"Los métodos basados en umbrales identifican cambios en la relación lactato-carga; otros usan concentraciones arbitrarias como 4 mmol/L, que no representan necesariamente el mismo punto fisiológico en todos."],
["¿Qué ocurre con la ventilación cerca del umbral anaeróbico?",["Aumenta de forma desproporcionada respecto al incremento de VO₂","Desaparece","Disminuye a cero","No responde al ejercicio"],0,"El aumento de CO₂ asociado al tamponamiento metabólico contribuye a una elevación desproporcionada de la ventilación."],
["¿Qué adaptación periférica aumenta la extracción de O₂?",["Mayor capilarización y capacidad oxidativa muscular","Menor densidad mitocondrial","Reducción de mioglobina","Menor perfusión muscular"],0,"Capilarización, mitocondrias y enzimas oxidativas favorecen la extracción y utilización periférica de oxígeno."],
["¿Qué efecto tiene el entrenamiento de intervalos de alta intensidad?",["Puede mejorar VO₂máx y capacidad de sostener intensidades elevadas","Solo mejora flexibilidad","Impide adaptaciones cardiovasculares","Reduce necesariamente la capacidad oxidativa"],0,"Los intervalos intensos pueden generar fuertes estímulos cardiovasculares y periféricos, mejorando VO₂máx y rendimiento según dosis y contexto."],
["¿Qué representa la economía de carrera?",["Consumo de O₂ requerido para una velocidad submáxima determinada","VO₂máx absoluto exclusivamente","Frecuencia cardíaca máxima","Lactato en reposo"],0,"La economía de carrera cuantifica el coste de oxígeno de desplazarse a una velocidad submáxima determinada."],
["¿Qué adaptación cardiovascular suele acompañar al entrenamiento de resistencia?",["Mayor volumen sistólico y expansión del volumen plasmático","Menor volumen plasmático","Menor capacidad de transporte de O₂","Reducción permanente del gasto cardíaco máximo"],0,"El entrenamiento aeróbico puede aumentar volumen plasmático, retorno venoso y volumen sistólico, mejorando la capacidad cardiovascular."],
["¿Qué ocurre con el glucógeno muscular durante ejercicio prolongado?",["Puede disminuir de forma importante y limitar el rendimiento si se agota","Aumenta indefinidamente","No se utiliza durante ejercicio","Solo se utiliza en reposo"],0,"El glucógeno muscular es un sustrato importante y puede reducirse progresivamente durante ejercicio prolongado, especialmente a intensidades altas."],
["¿Qué efecto tiene una disponibilidad adecuada de carbohidratos antes y durante ejercicio prolongado?",["Puede ayudar a mantener glucemia, oxidación de carbohidratos y rendimiento","Bloquea toda oxidación grasa","Reduce necesariamente el rendimiento","Elimina la necesidad de hidratación"],0,"Los carbohidratos pueden sostener la glucemia y aportar combustible exógeno, ayudando a preservar el rendimiento durante esfuerzos prolongados."],
["¿Qué define mejor la resistencia muscular local?",["Capacidad de un grupo muscular para sostener o repetir contracciones durante un tiempo","Capacidad máxima de producir una sola contracción","Flexibilidad pasiva","Velocidad de conducción nerviosa"],0,"La resistencia muscular local se refiere a sostener o repetir esfuerzos de un grupo muscular frente a una carga determinada."],
["¿Qué ocurre con el lactato durante recuperación activa?",["Puede oxidarse y contribuir a la producción energética","Solo se almacena en articulaciones","Se convierte exclusivamente en grasa","No puede reutilizarse"],0,"El lactato puede ser captado y oxidado por músculo y otros tejidos; la recuperación activa puede modificar su aclaramiento, aunque no es el único objetivo fisiológico."],
["¿Qué variable es más útil para prescribir intervalos en un deporte específico?",["Una combinación de intensidad relativa, duración, recuperación y respuesta individual","Solo la distancia total anual","Solo la edad","Únicamente la frecuencia cardíaca de reposo"],0,"La dosis de intervalos depende de intensidad, duración, número de repeticiones, recuperación y respuesta del deportista."],
["¿Qué caracteriza una adaptación central frente a una periférica?",["Central: cambios cardiovasculares; periférica: cambios musculares locales","Central: cambios en sarcómero únicamente","Periférica: cambios exclusivos en cerebro","No existe diferencia"],0,"Las adaptaciones centrales incluyen cambios cardíacos y circulatorios; las periféricas incluyen capilarización, mitocondrias y capacidad oxidativa muscular."],
["¿Qué sucede con la frecuencia cardíaca máxima por el entrenamiento aeróbico?",["Suele cambiar poco; las mejoras de rendimiento dependen más de otros componentes","Aumenta indefinidamente","Siempre disminuye 30 lpm","Se duplica en todos"],0,"La frecuencia cardíaca máxima es relativamente estable y no suele ser el principal mecanismo de mejora. Cambios en volumen sistólico, extracción y economía son más relevantes."],
["¿Qué efecto puede tener entrenar continuamente a intensidades demasiado altas?",["Puede acumular fatiga y limitar la calidad o recuperación de las sesiones","Siempre maximiza adaptación","Elimina necesidad de descanso","No afecta el sistema nervioso"],0,"Una dosis excesiva de alta intensidad puede generar fatiga acumulada y reducir la capacidad de entrenar con calidad."],
["¿Qué es el tiempo hasta el agotamiento?",["Tiempo durante el cual se puede sostener una carga o intensidad definida antes de no poder continuar","Tiempo total de sueño","Tiempo de calentamiento","Tiempo de recuperación entre series"],0,"Es una medida específica de tolerancia a una intensidad o carga determinada y no debe confundirse con pruebas de tiempo de carrera o contrarreloj."],
["¿Qué representa una prueba contrarreloj?",["Completar una distancia o tarea en el menor tiempo posible según protocolo","Mantener siempre una frecuencia cardíaca fija","Medir exclusivamente VO₂máx","Medir flexibilidad"],0,"Una contrarreloj evalúa rendimiento funcional directamente: completar una distancia o tarea tan rápido como sea posible bajo condiciones estandarizadas."],
["¿Qué adaptación puede disminuir la frecuencia cardíaca a una misma velocidad submáxima?",["Mayor volumen sistólico y eficiencia cardiovascular","Menor volumen sistólico","Menor retorno venoso","Reducción del transporte de O₂"],0,"Si el corazón expulsa más sangre por latido y el transporte de oxígeno es más eficiente, puede requerirse menor frecuencia cardíaca para una misma demanda submáxima."],
["¿Qué determina en gran medida la intensidad relativa de una sesión aeróbica?",["La relación entre la carga externa y la capacidad fisiológica individual","Solo la distancia absoluta","Solo el tiempo total","El número de ejercicios de fuerza"],0,"Una misma velocidad o potencia absoluta puede representar intensidades relativas muy diferentes entre deportistas."]
],
fatiga:[
["¿Qué diferencia principal existe entre fatiga central y periférica?",["Central involucra procesos del sistema nervioso central; periférica incluye limitaciones en el músculo y aparato contráctil","Central ocurre solo en el músculo","Periférica ocurre solo en el cerebro","Son términos idénticos"],0,"La fatiga es multifactorial. La central incluye cambios en la activación neural; la periférica incluye alteraciones musculares que reducen la producción de fuerza."],
["¿Qué metabolito puede contribuir a alteraciones contráctiles durante ejercicio intenso?",["Pi y cambios asociados al equilibrio iónico y metabolismo","Hemoglobina exclusivamente","Colágeno plasmático","Glucógeno hepático exclusivamente"],0,"El aumento de fosfato inorgánico, alteraciones de Ca²⁺ y otros cambios metabólicos pueden reducir la capacidad contráctil durante esfuerzos intensos."],
["¿Qué factor favorece la recuperación del glucógeno muscular?",["Reposición adecuada de carbohidratos después del ejercicio","Evitar toda ingesta energética","Aumentar ejercicio intenso inmediatamente","Eliminar el sueño"],0,"La disponibilidad de carbohidratos facilita la resíntesis de glucógeno, especialmente cuando existe una ventana temporal corta antes de otra sesión exigente."],
["¿Qué ocurre con el daño muscular inducido por ejercicio no habitual?",["Puede elevar marcadores de daño y alterar temporalmente fuerza y función","Siempre mejora inmediatamente la fuerza","No produce ningún cambio","Solo afecta al corazón"],0,"El ejercicio no habitual, especialmente con componente excéntrico, puede producir alteraciones temporales de fuerza, dolor y marcadores asociados al daño muscular."],
["¿Qué describe DOMS?",["Dolor muscular de aparición tardía después de ejercicio, especialmente no habitual","Dolor agudo exclusivamente durante el calentamiento","Fiebre por infección","Dolor articular permanente"],0,"DOMS suele aparecer horas después de un ejercicio no habitual, alcanza su máxima intensidad posteriormente y se relaciona con cambios musculares y tejido conectivo."],
["¿Qué variable puede ayudar a detectar fatiga acumulada?",["Cambios sostenidos en rendimiento junto con RPE y medidas de bienestar","Una sola frecuencia cardíaca aislada","Color de la piel","Longitud corporal"],0,"La tendencia conjunta de rendimiento, percepción del esfuerzo, sueño, estrés y carga puede revelar acumulación de fatiga mejor que una medición aislada."],
["¿Qué es la supercompensación en el modelo clásico?",["Una representación en la que una capacidad funcional puede recuperarse y superar temporalmente el nivel basal","Pérdida permanente de adaptación","Aumento inmediato después de cualquier ejercicio","Ausencia de recuperación"],0,"El modelo clásico describe descenso temporal, recuperación y posible elevación transitoria sobre el nivel basal. Es una simplificación y no explica toda la complejidad de la adaptación."],
["¿Qué efecto tiene el sueño sobre recuperación deportiva?",["Apoya procesos neuroendocrinos, inmunitarios, cognitivos y de recuperación física","Solo afecta la flexibilidad","No tiene relación con rendimiento","Reduce siempre la síntesis proteica"],0,"El sueño adecuado participa en recuperación fisiológica, regulación hormonal, función inmune, memoria motora y percepción del esfuerzo."],
["¿Qué puede ocurrir con el rendimiento si se acumulan varias sesiones duras sin recuperación suficiente?",["Puede disminuir temporalmente por fatiga acumulada","Aumenta siempre","Permanece idéntico independientemente de la carga","Se vuelve independiente del sueño"],0,"La carga repetida sin recuperación puede producir fatiga acumulada y reducir el rendimiento, aunque la respuesta depende de la magnitud y del estado individual."],
["¿Qué diferencia hay entre fatiga y sobreentrenamiento?",["La fatiga es frecuente y reversible; el síndrome de sobreentrenamiento implica deterioro persistente y multifactorial","Son exactamente iguales","La fatiga siempre requiere meses de recuperación","Sobreentrenamiento ocurre después de una sola sesión"],0,"La fatiga aguda es normal. El sobreentrenamiento es un estado complejo y menos frecuente caracterizado por disminución persistente del rendimiento y múltiples alteraciones."],
["¿Qué función tiene la recuperación activa de baja intensidad?",["Puede favorecer flujo sanguíneo y recuperación subjetiva sin añadir una carga excesiva","Siempre elimina todo lactato en minutos","Aumenta necesariamente el daño muscular","Sustituye el sueño"],0,"La actividad ligera puede mejorar sensación de recuperación y mantener movilidad; no existe evidencia de que elimine mágicamente toda la fatiga."],
["¿Qué factor aumenta la demanda de recuperación de una sesión?",["Mayor volumen, intensidad, novedad y proximidad al fallo","Mayor descanso y menor volumen","Menor carga externa siempre","Sesión de movilidad ligera únicamente"],0,"La carga de recuperación depende de intensidad, volumen, novedad, daño muscular, estrés y otros factores. No existe una única variable determinante."],
["¿Qué ocurre con la fuerza después de un ejercicio excéntrico no habitual?",["Puede disminuir temporalmente por alteraciones neuromusculares y musculares","Aumenta siempre de inmediato","No cambia bajo ninguna circunstancia","Se pierde permanentemente"],0,"Las contracciones excéntricas no habituales pueden producir una reducción transitoria de fuerza, acompañada de dolor y cambios en función muscular."],
["¿Qué papel tiene la hidratación en recuperación?",["Ayuda a restaurar volumen de líquidos y mantener función fisiológica, especialmente tras pérdidas importantes","No tiene ningún efecto fisiológico","Solo influye en masa muscular","Sustituye carbohidratos y proteínas"],0,"La reposición de líquidos es relevante cuando existe pérdida significativa. Debe considerarse junto con electrolitos, energía y contexto ambiental."],
["¿Qué significa carga interna?",["Respuesta fisiológica o perceptual individual al estímulo externo","Peso de la barra únicamente","Distancia recorrida únicamente","Número de sesiones planificadas"],0,"La carga interna representa cuánto impacto tiene el estímulo sobre el organismo, usando variables como RPE, frecuencia cardíaca o respuestas fisiológicas."],
["¿Qué significa carga externa?",["Trabajo o estímulo prescrito/realizado, como distancia, velocidad, peso o repeticiones","Frecuencia cardíaca únicamente","Dolor percibido","Calidad del sueño"],0,"La carga externa describe lo que el deportista realiza objetivamente. La carga interna describe cómo responde a ello."],
["¿Qué puede indicar que una misma carga externa tenga RPE progresivamente mayor?",["Posible aumento de fatiga o menor capacidad de recuperación","Mejor recuperación necesariamente","Aumento obligatorio de fuerza","Ausencia de adaptación"],0,"Si la misma tarea se percibe cada vez más difícil, puede reflejar fatiga, estrés, sueño insuficiente, enfermedad u otros factores."],
["¿Qué estrategia permite reducir carga manteniendo cierta especificidad?",["Disminuir volumen manteniendo parte de la intensidad o patrón relevante","Eliminar toda práctica","Duplicar el volumen","Entrenar siempre al fallo"],0,"Durante un taper, suele reducirse principalmente el volumen mientras se mantiene una dosis de intensidad y especificidad para conservar adaptaciones."],
["¿Qué es tapering?",["Reducción planificada de la carga antes de una competición para disminuir fatiga manteniendo preparación","Aumento máximo de volumen antes de competir","Eliminación total del entrenamiento por meses","Entrenamiento exclusivamente regenerativo durante toda la temporada"],0,"El taper reduce estratégicamente la carga, especialmente el volumen, para disminuir fatiga sin perder las adaptaciones relevantes."],
["¿Por qué la recuperación debe individualizarse?",["Porque la misma carga externa produce respuestas diferentes según entrenamiento, sueño, estrés, nutrición y otros factores","Porque todos recuperan exactamente igual","Porque solo importa la edad","Porque la recuperación no tiene relación con carga"],0,"La respuesta a una carga depende de múltiples variables individuales y contextuales, por lo que la dosis de recuperación no puede fijarse de forma idéntica para todos."]
],
controlmotor:[
["¿Qué es la propiocepción?",["Capacidad de percibir información relacionada con posición y movimiento corporal","Capacidad de producir ATP","Control exclusivo de la respiración","Percepción visual de colores"],0,"La propiocepción integra información de receptores musculares, tendinosos, articulares y otras fuentes para informar sobre posición y movimiento."],
["¿Qué función cumple el cerebelo en el movimiento?",["Contribuye a coordinación, temporización y corrección de errores motores","Produce la mayoría del ATP muscular","Regula exclusivamente la presión arterial","Controla directamente la hemoglobina"],0,"El cerebelo integra información sensorial y motora y contribuye a coordinación, aprendizaje y corrección de errores."],
["¿Qué es el feedback intrínseco?",["Información sensorial generada por el propio movimiento","Instrucción verbal externa exclusivamente","Un suplemento nutricional","Una medición de lactato"],0,"El feedback intrínseco procede de los sistemas sensoriales del propio deportista: visión, propiocepción, tacto, vestibular, etc."],
["¿Qué es feedback extrínseco?",["Información adicional proporcionada por entrenador, dispositivo o entorno","Sensación muscular interna exclusivamente","Señal de los husos musculares","Información vestibular únicamente"],0,"El feedback extrínseco es información añadida externamente, por ejemplo una medición de velocidad, video o indicación técnica."],
["¿Qué caracteriza una práctica bloqueada?",["Repetir la misma habilidad o variante durante un bloque antes de cambiar","Cambiar tarea en cada repetición","Practicar solo bajo fatiga","Eliminar la repetición"],0,"La práctica bloqueada mantiene la misma tarea repetidamente. Puede facilitar el rendimiento inmediato, aunque la práctica variable puede favorecer la transferencia en ciertos contextos."],
["¿Qué caracteriza una práctica aleatoria?",["Variar las tareas o condiciones de práctica de forma frecuente","Repetir una sola tarea durante toda la sesión","Eliminar feedback","Usar siempre la misma carga"],0,"La práctica aleatoria aumenta la variabilidad contextual y puede dificultar el rendimiento durante la sesión, pero favorecer retención y transferencia en determinadas habilidades."],
["¿Qué es transferencia de aprendizaje?",["Influencia de una habilidad previamente aprendida sobre el desempeño de otra tarea","Pérdida de memoria","Aumento de frecuencia cardíaca","Cambio de composición corporal"],0,"La transferencia ocurre cuando una habilidad o experiencia previa facilita o perjudica el aprendizaje o desempeño de otra tarea."],
["¿Qué papel tiene la atención en una habilidad compleja?",["Permite seleccionar información relevante y orientar recursos hacia componentes de la tarea","No tiene influencia","Solo controla frecuencia cardíaca","Sustituye la práctica"],0,"La atención ayuda a priorizar señales relevantes. Con la automatización, algunos componentes pueden requerir menos atención consciente."],
["¿Qué es automatización motora?",["Ejecución con menor necesidad de control consciente de componentes básicos","Ausencia de aprendizaje","Pérdida de coordinación","Aumento obligatorio de esfuerzo cognitivo"],0,"La práctica puede hacer que componentes de una habilidad se ejecuten con menor atención consciente, liberando recursos para otras demandas."],
["¿Qué función tiene la variabilidad de práctica?",["Puede ampliar las soluciones motoras disponibles y mejorar adaptación a diferentes condiciones","Siempre empeora aprendizaje","Elimina especificidad","Impide retención"],0,"Variar condiciones puede favorecer la capacidad de adaptar la solución motora a cambios del entorno, aunque debe dosificarse según experiencia y objetivo."],
["¿Qué es el control feedforward?",["Planificación o anticipación de una acción antes de recibir el feedback completo del resultado","Corrección exclusivamente posterior","Ausencia de predicción","Respuesta hormonal"],0,"El control feedforward utiliza información previa y predicciones para preparar una acción, mientras el feedback permite corregirla."],
["¿Qué es el control por feedback?",["Ajustar la acción usando información sensorial sobre el movimiento o resultado","Planificar sin recibir información","Eliminar aferencias","Usar únicamente memoria genética"],0,"El feedback permite comparar información sensorial con el objetivo y ajustar el movimiento durante o después de la acción."],
["¿Qué papel tiene el sistema vestibular?",["Aporta información sobre aceleración y orientación de la cabeza respecto a la gravedad","Controla directamente la glucólisis","Produce fuerza muscular","Regula exclusivamente temperatura"],0,"El sistema vestibular detecta aceleraciones angulares y lineales y contribuye al equilibrio y orientación espacial."],
["¿Qué ocurre con la precisión cuando aumenta la velocidad de movimiento en ciertas tareas?",["Puede disminuir por compromisos velocidad-precisión","Siempre aumenta","No puede cambiar","Se vuelve independiente de la tarea"],0,"En muchas tareas existe un compromiso velocidad-precisión: aumentar velocidad puede dificultar el control fino."],
["¿Qué es coordinación intermuscular?",["Organización temporal y relativa de diferentes músculos para producir una tarea","Capacidad de una sola fibra de generar ATP","Movilidad articular","Frecuencia respiratoria"],0,"La coordinación intermuscular describe cómo varios músculos cooperan, estabilizan y generan movimiento de manera organizada."],
["¿Qué es coordinación intramuscular?",["Organización de la activación dentro de un músculo, incluyendo reclutamiento y frecuencia de descarga","Coordinación entre articulaciones exclusivamente","Control respiratorio","Movilidad de la fascia"],0,"La coordinación intramuscular incluye cómo se reclutan unidades motoras y cómo se modula su actividad dentro del mismo músculo."],
["¿Qué efecto puede tener la fatiga sobre el control motor?",["Puede modificar estrategia, precisión y coordinación para mantener la tarea","Siempre mejora precisión","No cambia el movimiento","Solo cambia la temperatura"],0,"La fatiga puede alterar activación muscular, atención, percepción y estrategia, modificando la ejecución motora."],
["¿Qué es una habilidad abierta?",["Una habilidad realizada en un entorno cambiante que exige adaptación","Una habilidad sin movimiento","Una habilidad exclusivamente isométrica","Una habilidad que no requiere percepción"],0,"Las habilidades abiertas se ejecutan en entornos impredecibles o cambiantes y requieren adaptación continua."],
["¿Qué es una habilidad cerrada?",["Una habilidad realizada en condiciones relativamente estables y predecibles","Una habilidad siempre reactiva","Una habilidad sin práctica","Una habilidad exclusivamente acuática"],0,"Las habilidades cerradas se ejecutan en condiciones relativamente estables, permitiendo mayor anticipación y control predecible."],
["¿Qué principio favorece el aprendizaje al ajustar dificultad?",["Progresión desde tareas manejables hacia demandas mayores sin perder el objetivo de la habilidad","Aumentar dificultad al máximo desde el inicio","Eliminar práctica específica","Cambiar de tarea sin objetivo"],0,"La dificultad debe permitir suficiente éxito y desafío para promover aprendizaje, progresando conforme mejora la capacidad."]
],
movilidad:[
["¿Qué diferencia básica existe entre flexibilidad y movilidad?",["Flexibilidad se refiere principalmente a extensibilidad/ROM; movilidad incluye capacidad de controlar ese ROM","Son términos completamente idénticos","Movilidad es solo fuerza","Flexibilidad es solo equilibrio"],0,"Flexibilidad suele referirse al rango disponible o extensibilidad; movilidad incorpora la capacidad de acceder y controlar ese rango de movimiento."],
["¿Qué estructura limita mecánicamente el ROM de una articulación?",["Puede contribuir la geometría articular, cápsula, músculo, tendón y tejido neural","Solo la piel","Solo el hueso en todos los casos","Solo el músculo"],0,"El ROM resulta de la interacción entre estructura articular y propiedades de tejidos blandos y sistema neuromuscular."],
["¿Qué efecto agudo puede producir un estiramiento estático?",["Aumentar temporalmente el ROM y la tolerancia al estiramiento","Crear hipertrofia inmediata","Aumentar permanentemente la longitud muscular en minutos","Eliminar todo tono muscular"],0,"El estiramiento puede aumentar temporalmente el ROM por cambios en tolerancia y propiedades mecánicas. Los cambios estructurales permanentes requieren adaptación prolongada."],
["¿Qué diferencia existe entre movilidad activa y pasiva?",["La activa se alcanza con la fuerza del propio individuo; la pasiva con ayuda externa","La pasiva siempre requiere contracción máxima","La activa no requiere músculo","Son exactamente iguales"],0,"El ROM activo depende de la capacidad de producir y controlar movimiento; el pasivo puede ser mayor porque una fuerza externa lleva la articulación más lejos."],
["¿Qué es rigidez mecánica de un tejido?",["Resistencia al cambio de longitud o deformación ante una carga","Cantidad total de ATP","Capacidad de producir calor","Velocidad de conducción nerviosa"],0,"La rigidez expresa cuánto se resiste un tejido a deformarse ante una carga determinada."],
["¿Qué adaptación puede ocurrir en un tendón sometido a carga progresiva adecuada?",["Cambios en rigidez, estructura y capacidad de transmitir fuerza","Pérdida obligatoria de colágeno","Ausencia total de remodelación","Acortamiento permanente inmediato"],0,"El tendón es un tejido dinámico que puede remodelarse con carga mecánica progresiva, modificando propiedades estructurales y mecánicas."],
["¿Qué papel tiene el tejido conectivo en el movimiento?",["Transmite fuerzas y contribuye a las propiedades mecánicas de músculos y articulaciones","Solo almacena glucosa","Produce eritrocitos","Controla la frecuencia cardíaca"],0,"Fascias, tendones, ligamentos y otros tejidos conectivos contribuyen a transmisión de fuerzas y estabilidad."],
["¿Qué es creep o fluencia viscoelástica?",["Deformación progresiva de un tejido bajo una carga constante","Recuperación instantánea","Aumento de fuerza máxima","Contracción voluntaria"],0,"La fluencia describe el aumento progresivo de deformación cuando un tejido viscoelástico soporta una carga constante."],
["¿Qué es relajación de estrés?",["Disminución de tensión interna cuando un tejido mantiene una deformación constante","Aumento de longitud sin carga","Aumento de fuerza muscular","Reducción de temperatura"],0,"En materiales viscoelásticos, mantener una deformación constante puede producir una disminución progresiva de la tensión necesaria para mantenerla."],
["¿Qué función cumple el líquido sinovial?",["Reduce fricción y participa en nutrición del cartílago articular","Aumenta exclusivamente la masa muscular","Produce ATP","Une directamente actina y miosina"],0,"El líquido sinovial facilita la lubricación y contribuye al intercambio de nutrientes en el cartílago articular."],
["¿Qué característica tiene el cartílago articular?",["Es tejido especializado que distribuye cargas y reduce fricción en la articulación","Tiene alta vascularización directa","Se regenera rápidamente como músculo","No soporta compresión"],0,"El cartílago articular soporta y distribuye cargas y facilita el movimiento con baja fricción, pero su capacidad de reparación es limitada."],
["¿Qué papel tiene el rango de movimiento en entrenamiento de fuerza?",["Puede modificar longitudes musculares, momentos articulares y distribución de trabajo","Nunca afecta la demanda muscular","Solo cambia la frecuencia cardíaca","Elimina la necesidad de carga"],0,"El ROM modifica la posición articular y muscular y, por tanto, puede cambiar brazos de momento, tensión y trabajo realizado."],
["¿Qué diferencia existe entre ROM fisiológico y anatómico?",["El fisiológico corresponde al rango funcional disponible; el anatómico puede referirse al límite estructural máximo","Son siempre idénticos","El anatómico depende solo de fuerza","El fisiológico no depende de tejidos"],0,"El ROM disponible durante una tarea está condicionado por control, dolor, fuerza y estructura; el límite anatómico representa restricciones estructurales."],
["¿Qué efecto puede tener una temperatura muscular mayor sobre la extensibilidad aguda?",["Puede reducir temporalmente la rigidez y facilitar movimiento","Siempre aumenta rigidez","No puede modificar propiedades viscoelásticas","Destruye tejido conectivo"],0,"El calentamiento puede modificar temporalmente propiedades mecánicas y neuromusculares, facilitando movimiento, aunque el efecto depende del tejido y protocolo."],
["¿Qué función tienen los husos musculares durante un estiramiento rápido?",["Detectan cambios de longitud y velocidad y pueden aumentar respuesta refleja","Detectan glucosa","Producen colágeno","Bloquean toda activación"],0,"Los husos son sensibles a longitud y velocidad de estiramiento y pueden contribuir al reflejo de estiramiento."],
["¿Qué puede suceder con el ROM si existe dolor durante el movimiento?",["Puede reducirse por protección, aumento de tono o modificación del comportamiento motor","Siempre aumenta","No afecta el movimiento","Solo afecta la frecuencia cardíaca"],0,"El dolor puede modificar la estrategia motora y la tolerancia, reduciendo el ROM disponible sin que necesariamente exista una limitación estructural permanente."],
["¿Qué caracteriza una contracción isométrica en un programa de movilidad?",["Puede generar fuerza sin cambio apreciable de longitud externa y utilizarse para controlar rangos específicos","Siempre aumenta ROM pasivo inmediatamente","No requiere activación muscular","Solo sirve para resistencia aeróbica"],0,"Las isometrías permiten producir tensión en una posición concreta y pueden utilizarse para fortalecer y controlar rangos determinados."],
["¿Qué es movilidad articular controlada?",["Capacidad de explorar un rango y producir fuerza/control dentro de él","Solo alcanzar pasivamente el máximo rango","Evitar toda carga","Aumentar exclusivamente frecuencia cardíaca"],0,"La movilidad funcional implica no solo disponer de ROM, sino controlar activamente las posiciones y producir fuerza dentro de ellas."],
["¿Qué factor puede limitar la dorsiflexión del tobillo?",["Movilidad talocrural, extensibilidad muscular, estructura ósea, dolor o control motor","Solo la longitud del fémur","Solo la fuerza de agarre","Solo la ventilación"],0,"La dorsiflexión puede estar limitada por múltiples factores locales y neuromusculares; no existe una única causa universal."],
["¿Qué diferencia existe entre elasticidad y plasticidad?",["Elasticidad implica recuperar forma tras retirar la carga; plasticidad implica deformación más permanente","Son idénticas","Plasticidad siempre es inmediata","Elasticidad significa pérdida de tejido"],0,"La elasticidad describe recuperación de la forma tras retirar la carga; la plasticidad implica cambios más permanentes después de una deformación sostenida o adaptación."]

programacion:[
["¿Qué representa la periodización?",["Organización planificada de variables de entrenamiento a través del tiempo","Realizar siempre la misma sesión","Eliminar descansos","Cambiar ejercicios sin objetivo"],0,"La periodización organiza volumen, intensidad, frecuencia, ejercicios y recuperación en el tiempo para orientar adaptaciones y rendimiento."],
["¿Qué es una mesociclo?",["Bloque de varias semanas con un objetivo de entrenamiento específico","Una sola repetición","Un descanso de cinco minutos","Toda la carrera deportiva"],0,"Un mesociclo suele comprender varias semanas y se organiza alrededor de objetivos concretos dentro de una planificación mayor."],
["¿Qué es un microciclo?",["Unidad corta de planificación, frecuentemente una semana","Un año completo","Una repetición máxima","Un solo calentamiento"],0,"El microciclo es una unidad breve de planificación que puede durar aproximadamente una semana, aunque su duración depende del deporte y estructura."],

["¿Qué factor reduce la fiabilidad de un test de rendimiento?",["Cambios en calentamiento, instrucciones, equipamiento o condiciones ambientales","Estandarización estricta","Mismo horario y protocolo","Familiarización previa"],0,"La falta de estandarización puede aumentar error de medición y dificultar interpretar si un cambio refleja una adaptación real."],

["¿Qué principio ayuda a evitar estancamientos?",["Variar progresivamente estímulos manteniendo una lógica de sobrecarga y especificidad","Cambiar todo diariamente sin objetivo","Mantener siempre la misma carga","Eliminar recuperación"],0,"La variación planificada puede modificar el estímulo y evitar una adaptación excesiva a una dosis fija, sin perder continuidad ni especificidad."]
]
};

for (const topic of topics){
  topic.questions = (seed[topic.id] || []).map(x=>({q:x[0],options:x[1],answer:x[2],explanation:x[3]}));
  // Validación: cada sección debe contener exactamente 20 preguntas.
  if(topic.questions.length !== 20) console.warn(topic.id + " no tiene 20 preguntas");
}

let currentTopic=null,currentIndex=0,score=0,answered=false;

function validateQuestions(qs){
  return qs.every(x=>x.options.length===4 && Number.isInteger(x.answer) && x.answer>=0 && x.answer<4);
}
function renderTopics(){
  const term=document.getElementById("search").value.toLowerCase();
  const box=document.getElementById("topics"); box.innerHTML="";
  topics.filter(t=>t.title.toLowerCase().includes(term)||t.desc.toLowerCase().includes(term)).forEach(t=>{
    const c=document.createElement("div"); c.className="card";
    c.innerHTML=`<h3>${t.title}</h3><p>${t.desc}</p><p style="margin-top:12px">${t.questions.length}/20 preguntas cargadas</p>`;
    c.onclick=()=>startQuiz(t); box.appendChild(c);
  });
}
function startQuiz(topic){
  if(!validateQuestions(topic.questions)){alert("Hay una pregunta con formato inválido.");return;}
  if(topic.questions.length===0){alert("Esta sección todavía no tiene preguntas cargadas.");return;}
  currentTopic=topic;currentIndex=0;score=0;
  document.getElementById("home").style.display="none";document.getElementById("quiz").classList.add("active");
  renderQuestion();
}
function renderQuestion(){
  const q=currentTopic.questions[currentIndex]; answered=false;
  document.getElementById("quizTitle").textContent=currentTopic.title;
  document.getElementById("score").textContent=`${score}/${currentIndex}`;
  document.getElementById("bar").style.width=`${(currentIndex/currentTopic.questions.length)*100}%`;
  const box=document.getElementById("questionBox");
  box.innerHTML=`<div class="question">
    <div style="color:var(--muted)">Pregunta ${currentIndex+1} de ${currentTopic.questions.length}</div>
    <h2>${q.q}</h2>
    <div class="options">${q.options.map((o,i)=>`<button class="option" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div>
    <div id="explanation" class="explanation"><strong>Explicación:</strong> ${q.explanation}</div>
    <div class="actions"><button class="secondary" onclick="goHome()">Salir</button><button id="next" onclick="nextQuestion()" style="display:none">Siguiente →</button></div>
  </div>`;
}
function answer(i){
  if(answered)return; answered=true;
  const q=currentTopic.questions[currentIndex];
  document.querySelectorAll(".option").forEach((b,n)=>{
    b.disabled=true;
    if(n===q.answer)b.classList.add("correct");
    if(n===i && i!==q.answer)b.classList.add("wrong");
  });
  if(i===q.answer)score++;
  document.getElementById("score").textContent=`${score}/${currentIndex+1}`;
  document.getElementById("explanation").classList.add("show");
  document.getElementById("next").style.display="inline-block";
}
function nextQuestion(){
  if(!answered)return;
  currentIndex++;
  if(currentIndex>=currentTopic.questions.length){
    document.getElementById("questionBox").innerHTML=`<div class="question"><h2>Sección completada</h2><p class="score">Resultado: ${score}/${currentTopic.questions.length}</p><p>Revisa las explicaciones y vuelve a intentarlo para consolidar el aprendizaje.</p><button onclick="startQuiz(currentTopic)">Repetir sección</button> <button class="secondary" onclick="goHome()">Volver a temas</button></div>`;
    document.getElementById("bar").style.width="100%";return;
  }
  renderQuestion();
}
function goHome(){document.getElementById("quiz").classList.remove("active");document.getElementById("home").style.display="block";renderTopics();}
function resetProgress(){if(confirm("¿Reiniciar el progreso de esta sesión?")){currentIndex=0;score=0;alert("Progreso reiniciado.");}}
renderTopics();
</script>
